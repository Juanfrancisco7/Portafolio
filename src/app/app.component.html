<!-- Notificación de bienvenida (MundoJuan + J-Food) -->
@if (showWelcomeNotification) {
  <aside class="welcome" role="status">
    <span class="welcome__icon"><i class="fa-solid fa-utensils"></i></span>
    <p>
      ¿Ya visitaste <a href="https://www.mundojuan.com" target="_blank" rel="noopener noreferrer">MUNDOJUAN</a>?
      También tienes que probar <strong>J-FOOD</strong>, mi app de nutrición con IA.
      <a href="#contactame" (click)="showWelcomeNotification = false">Contacta conmigo</a> y te guío paso a paso para instalarla.
    </p>
    <button type="button" class="welcome__close" (click)="showWelcomeNotification = false" aria-label="Cerrar aviso">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </aside>
}
