<section class="section gallery" id="galeria">
  <div class="container">

    <div class="section-head center" appReveal>
      <span class="eyebrow">Galería</span>
      <h2 class="section-title">Más allá de la <span class="hl">pantalla</span></h2>
      <p class="section-sub">Viajes, montaña, motor y momentos que me inspiran.</p>
    </div>

    <ul class="masonry">
      @for (img of images; track img.src; let i = $index) {
        @if (isVisible(i)) {
          <li class="masonry__item" appReveal [revealDelay]="(i % 4) * 60">
            <button type="button" class="photo" (click)="lightboxIndex = i" [attr.aria-label]="'Abrir ' + img.alt">
              <img [src]="thumbs[i]" [alt]="img.alt" loading="lazy" />
              <span class="photo__overlay"><i class="fa-solid fa-expand"></i></span>
            </button>
          </li>
        }
      }
    </ul>

    @if (images.length > initialCount) {
      <div class="more" appReveal>
        <button class="btn btn-ghost" type="button" (click)="showAll = !showAll">
          @if (showAll) {
            <i class="fa-solid fa-chevron-up"></i> Ver menos
          } @else {
            Ver todas las fotos ({{ images.length }}) <i class="fa-solid fa-chevron-down"></i>
          }
        </button>
      </div>
    }
  </div>
</section>

<app-lightbox [items]="images" [index]="lightboxIndex" (indexChange)="lightboxIndex = $event" title="Galería"></app-lightbox>
