<section class="section certs" id="certificaciones">
  <div class="container">

    <div class="certs__head">
      <div class="section-head" appReveal>
        <span class="eyebrow">Certificaciones</span>
        <h2 class="section-title">Aprendizaje <span class="hl">constante</span></h2>
        <p class="section-sub">Cursos y certificaciones que respaldan mi formación. Toca cualquiera para verla en grande.</p>
      </div>
      <div class="certs__count" appReveal [revealDelay]="100">
        <strong>{{ certs.length }}</strong>
        <span>certificados</span>
      </div>
    </div>

    <ul class="certs__grid">
      @for (cert of certs; track cert.src; let i = $index) {
        @if (isVisible(i)) {
          <li appReveal [revealDelay]="(i % 4) * 70">
            <button type="button" class="cert" (click)="lightboxIndex = i" [attr.aria-label]="'Ver ' + cert.alt">
              <img [src]="thumbs[i]" [alt]="cert.alt" loading="lazy" />
              <span class="cert__overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></span>
            </button>
          </li>
        }
      }
    </ul>

    @if (certs.length > initialCount) {
      <div class="more" appReveal>
        <button class="btn btn-ghost" type="button" (click)="showAll = !showAll">
          @if (showAll) {
            <i class="fa-solid fa-chevron-up"></i> Ver menos
          } @else {
            Ver las {{ certs.length }} certificaciones <i class="fa-solid fa-chevron-down"></i>
          }
        </button>
      </div>
    }
  </div>
</section>

<app-lightbox [items]="certs" [index]="lightboxIndex" (indexChange)="lightboxIndex = $event" title="Certificaciones"></app-lightbox>
